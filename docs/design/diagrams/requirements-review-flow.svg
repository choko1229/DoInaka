<svg xmlns="http://www.w3.org/2000/svg" font-family="BIZ UDPGothic, Hiragino Sans, Noto Sans JP, sans-serif" style="background:#ffffff" viewBox="0 0 760 566" role="img" aria-label="公開されるのは人の承認か条件を満たした自動承認だけ" font-size="13"><defs><marker id="rev-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a877f"></path></marker></defs><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1b">公開されるのは人の承認か、条件を満たした自動承認だけ</text><g data-claude-anchor="connectors" fill="none" stroke="#8a877f" stroke-width="1.25"><path d="M380 112V156" marker-end="url(#rev-arrow)"></path><path d="M500 184H560" marker-end="url(#rev-arrow)"></path><path d="M380 212V256" marker-end="url(#rev-arrow)"></path><path d="M380 312V376" marker-end="url(#rev-arrow)"></path><path d="M260 284H130V376" marker-end="url(#rev-arrow)"></path><path d="M500 284H640V376" marker-end="url(#rev-arrow)"></path><path d="M240 404H270" marker-end="url(#rev-arrow)"></path><path d="M490 404H550" marker-end="url(#rev-arrow)"></path><path d="M380 432V486" marker-end="url(#rev-arrow)"></path></g><g data-claude-anchor="step-submit"><rect x="260" y="56" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="submit" x="380" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1b">投稿受付</text><text data-claude-text-id="submit-sub" x="380" y="98" text-anchor="middle" font-size="11.5" fill="#5f5d57">匿名・会員どちらも</text></g><g data-claude-anchor="step-filter"><rect x="260" y="156" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="filter" x="380" y="180" text-anchor="middle" font-weight="600" fill="#1f1e1b">事前フィルタ</text><text data-claude-text-id="filter-sub" x="380" y="198" text-anchor="middle" font-size="11.5" fill="#5f5d57">Turnstile・レート制限・NGワード</text></g><g data-claude-anchor="step-refuse"><rect x="560" y="156" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="refuse" x="640" y="188" text-anchor="middle" fill="#1f1e1b">受付拒否</text></g><g data-claude-anchor="step-ai"><rect x="260" y="256" width="240" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="ai" x="380" y="280" text-anchor="middle" font-weight="600" fill="#1f1e1b">AI判定（キュー）</text><text data-claude-text-id="ai-sub" x="380" y="298" text-anchor="middle" font-size="11.5" fill="#5f5d57">スパム・画像・重複・整形提案</text></g><g data-claude-anchor="step-rejectbox"><rect x="20" y="376" width="220" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="rejectbox" x="130" y="400" text-anchor="middle" font-weight="600" fill="#1f1e1b">却下ボックス</text><text data-claude-text-id="rejectbox-sub" x="130" y="418" text-anchor="middle" font-size="11.5" fill="#5f5d57">一定期間保持して自動削除</text></g><g data-claude-anchor="step-queue"><rect x="270" y="376" width="220" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="queue" x="380" y="400" text-anchor="middle" font-weight="600" fill="#1f1e1b">審査待ち</text><text data-claude-text-id="queue-sub" x="380" y="418" text-anchor="middle" font-size="11.5" fill="#5f5d57">管理者がAI提案を参照</text></g><g data-claude-anchor="step-publish"><rect x="550" y="376" width="180" height="56" rx="8" fill="#b24a0c" fill-opacity="0.12" stroke="#b24a0c" stroke-width="2"></rect><text data-claude-text-id="publish" x="640" y="408" text-anchor="middle" font-weight="600" fill="#1f1e1b">公開</text></g><g data-claude-anchor="step-reject"><rect x="270" y="486" width="220" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="reject" x="380" y="518" text-anchor="middle" fill="#1f1e1b">却下（理由を記録）</text></g><text data-claude-text-id="lbl-refuse" x="530" y="150" text-anchor="middle" font-size="11.5" fill="#5f5d57">弾かれた投稿</text><text data-claude-text-id="lbl-spam" x="190" y="274" text-anchor="middle" font-size="11.5" fill="#5f5d57">明らかなスパム</text><text data-claude-text-id="lbl-auto-1" x="510" y="258" font-size="11.5" fill="#5f5d57">会員・実績・スコアの</text><text data-claude-text-id="lbl-auto-2" x="510" y="274" font-size="11.5" fill="#5f5d57">条件をすべて満たす</text><text data-claude-text-id="lbl-other" x="390" y="350" font-size="11.5" fill="#5f5d57">それ以外</text><text data-claude-text-id="lbl-restore" x="255" y="366" text-anchor="middle" font-size="11.5" fill="#5f5d57">管理者が復元</text><text data-claude-text-id="lbl-approve" x="520" y="394" text-anchor="middle" font-size="11.5" fill="#5f5d57">承認</text><text data-claude-text-id="lbl-reject" x="390" y="464" font-size="11.5" fill="#5f5d57">却下</text><text data-claude-text-id="note-ai-down-1" x="24" y="506" font-size="11.5" fill="#5f5d57">AIが使えないときは</text><text data-claude-text-id="note-ai-down-2" x="24" y="522" font-size="11.5" fill="#5f5d57">全件を審査待ちへ回す</text></svg>
