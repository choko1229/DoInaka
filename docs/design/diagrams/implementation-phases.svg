<svg xmlns="http://www.w3.org/2000/svg" font-family="BIZ UDPGothic, Hiragino Sans, Noto Sans JP, sans-serif" style="background:#ffffff" viewBox="0 0 760 820" role="img" aria-label="人の審査で回る形を先に作り、AIはその後に足す" font-size="13"><defs><marker id="phase-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a877f"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1f1e1b">人の審査で回る形を先に作り、AIはその後に足す</text><text data-claude-text-id="subtitle" x="24" y="48" font-size="11.5" fill="#5f5d57">各箱の2行目が次へ進む条件。フェーズ4と5は並行できる</text><g data-claude-anchor="connectors" fill="none" stroke="#8a877f" stroke-width="1.25"><path d="M380 124V152" marker-end="url(#phase-arrow)"></path><path d="M380 208V236" marker-end="url(#phase-arrow)"></path><path d="M380 292V320" marker-end="url(#phase-arrow)"></path><path d="M380 376V404" marker-end="url(#phase-arrow)"></path><path d="M380 460V474H190V488" marker-end="url(#phase-arrow)"></path><path d="M380 474H570V488" marker-end="url(#phase-arrow)"></path><path d="M570 544V572" marker-end="url(#phase-arrow)"></path><path d="M190 544V642H300V656" marker-end="url(#phase-arrow)"></path><path d="M570 628V642H460V656" marker-end="url(#phase-arrow)"></path><path d="M380 712V740" marker-end="url(#phase-arrow)"></path></g><g data-claude-anchor="kagoya-check"><rect x="210" y="68" width="340" height="56" rx="8" fill="#f4efe6" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="k-name" x="380" y="91" text-anchor="middle" font-weight="600" fill="#1f1e1b">kagoyaで確認スクリプト</text><text data-claude-text-id="k-gate" x="380" y="110" text-anchor="middle" font-size="11.5" fill="#5f5d57">PHP・DB・cronの条件が決まる</text></g><g data-claude-anchor="phase-0"><rect x="210" y="152" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="p0-name" x="380" y="175" text-anchor="middle" font-weight="600" fill="#1f1e1b">フェーズ0 土台</text><text data-claude-text-id="p0-gate" x="380" y="194" text-anchor="middle" font-size="11.5" fill="#5f5d57">CIが緑、リリースZIPが作れる</text></g><g data-claude-anchor="phase-1"><rect x="210" y="236" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="p1-name" x="380" y="259" text-anchor="middle" font-weight="600" fill="#1f1e1b">フェーズ1 設置と更新</text><text data-claude-text-id="p1-gate" x="380" y="278" text-anchor="middle" font-size="11.5" fill="#5f5d57">kagoyaに画面だけで設置・更新できる</text></g><g data-claude-anchor="phase-2"><rect x="210" y="320" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="p2-name" x="380" y="343" text-anchor="middle" font-weight="600" fill="#1f1e1b">フェーズ2 ログイン・2段階認証</text><text data-claude-text-id="p2-gate" x="380" y="362" text-anchor="middle" font-size="11.5" fill="#5f5d57">管理画面はTOTPなしで入れない</text></g><g data-claude-anchor="phase-3"><rect x="210" y="404" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="p3-name" x="380" y="427" text-anchor="middle" font-weight="600" fill="#1f1e1b">フェーズ3 データと管理</text><text data-claude-text-id="p3-gate" x="380" y="446" text-anchor="middle" font-size="11.5" fill="#5f5d57">管理者が行事・スポットを登録できる</text></g><g data-claude-anchor="phase-4"><rect x="40" y="488" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="p4-name" x="190" y="511" text-anchor="middle" font-weight="600" fill="#1f1e1b">フェーズ4 公開画面</text><text data-claude-text-id="p4-gate" x="190" y="530" text-anchor="middle" font-size="11.5" fill="#5f5d57">検索して詳細まで見られる</text></g><g data-claude-anchor="phase-5"><rect x="420" y="488" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="p5-name" x="570" y="511" text-anchor="middle" font-weight="600" fill="#1f1e1b">フェーズ5 投稿と審査</text><text data-claude-text-id="p5-gate" x="570" y="530" text-anchor="middle" font-size="11.5" fill="#5f5d57">人の審査だけで公開まで回る</text></g><g data-claude-anchor="phase-6"><rect x="420" y="572" width="300" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="p6-name" x="570" y="595" text-anchor="middle" font-weight="600" fill="#1f1e1b">フェーズ6 AI審査</text><text data-claude-text-id="p6-gate" x="570" y="614" text-anchor="middle" font-size="11.5" fill="#5f5d57">AIが止まっても人の審査に戻る</text></g><g data-claude-anchor="phase-7"><rect x="210" y="656" width="340" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a877f" stroke-width="1.25"></rect><text data-claude-text-id="p7-name" x="380" y="679" text-anchor="middle" font-weight="600" fill="#1f1e1b">フェーズ7 マイページ・運営</text><text data-claude-text-id="p7-gate" x="380" y="698" text-anchor="middle" font-size="11.5" fill="#5f5d57">管理画面だけで運営できる</text></g><g data-claude-anchor="phase-8"><rect x="210" y="740" width="340" height="56" rx="8" fill="#b24a0c" fill-opacity="0.12" stroke="#b24a0c" stroke-width="2"></rect><text data-claude-text-id="p8-name" x="380" y="763" text-anchor="middle" font-weight="600" fill="#1f1e1b">フェーズ8 公開準備 → 正式版(人が作る)</text><text data-claude-text-id="p8-gate" x="380" y="782" text-anchor="middle" font-size="11.5" fill="#1f1e1b">バックアップから戻せ、止まれば気づける</text></g></svg>
