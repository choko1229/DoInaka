<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>地図</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Yomogi&amp;family=Yusei+Magic&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-day{--bg:#fbf8ee;--surface:#ffffff;--sunken:#f2eedf;--ink:#26261c;--muted:#5a5a48;--line:#ddd7c2;--strong:#7d775e;--sky1:#9cd3ec;--sky2:#e8f4e1;--hill:#8fb86b;--on:#ffffff}
.t-morning{--bg:#f3f8f7;--surface:#ffffff;--sunken:#e6f0ee;--ink:#1e2b2a;--muted:#4f615f;--line:#cddcd9;--strong:#6a7f7c;--sky1:#cde8ef;--sky2:#f3f8f7;--hill:#a8c98d;--on:#ffffff}
.t-evening{--bg:#fbf1e6;--surface:#fffdf9;--sunken:#f4e3d2;--ink:#2e211a;--muted:#6a5246;--line:#e8d2bd;--strong:#8a6e5e;--sky1:#f2a65a;--sky2:#f9dcc0;--hill:#7c8a52;--on:#ffffff}
.t-night{--bg:#141b2b;--surface:#1d2638;--sunken:#0f1522;--ink:#eceff5;--muted:#a9b3c6;--line:#2c3850;--strong:#7d8aa3;--sky1:#0e1424;--sky2:#24304a;--hill:#1a2a2a;--on:#141b2b}
.s-spring{--accent:#b8325f}.s-summer{--accent:#1b7352}.s-autumn{--accent:#b24a0c}.s-winter{--accent:#2d5a99}
.t-night.s-spring{--accent:#f48fb5}.t-night.s-summer{--accent:#6fd3a6}.t-night.s-autumn{--accent:#f4a261}.t-night.s-winter{--accent:#8db4f0}
a{color:var(--accent)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="t-night s-autumn" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'BIZ UDPGothic', sans-serif; font-size: 16px; line-height: 28px;">

  <div aria-label="地図" style="position: absolute; inset: 0; background: var(--sunken);">
    <svg width="390" height="844" viewBox="0 0 390 844" fill="none" aria-hidden="true">
      <path d="M0 140 C80 160 120 120 200 150 S330 120 390 140 V0 H0Z" style="fill: #13233a;"></path>
      <path d="M-20 520 Q120 470 210 520 T420 500" stroke="#2c3850" stroke-width="12"></path>
      <path d="M150 140 Q170 330 120 844" stroke="#2c3850" stroke-width="7"></path>
      <path d="M260 160 Q300 420 360 844" stroke="#2c3850" stroke-width="5"></path>
      <path d="M40 300 Q100 280 140 320" stroke="#33405a" stroke-width="3"></path>
      <ellipse cx="300" cy="360" rx="34" ry="20" style="fill: #13233a;"></ellipse>
      <circle cx="70" cy="420" r="2" style="fill: #f2e27a;"></circle><circle cx="230" cy="620" r="1.6" style="fill: #f2e27a;"></circle><circle cx="340" cy="250" r="1.8" style="fill: #f2e27a;"></circle>
    </svg>
    <span style="position: absolute; left: 8px; bottom: 236px; font-size: 10px; line-height: 14px; color: var(--muted);">地理院タイル(淡色を夜用に調整)</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="Main.dc.html" aria-label="戻る" style="width: 44px; height: 44px; border-radius: 999px; background: var(--surface); color: var(--ink); display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">地図内を検索</label>
      <input id="mq" type="search" placeholder="この範囲で探す" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 16px; border: 2px solid var(--strong); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit;">
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto;">
      <button aria-pressed="true" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">イベント</button>
      <button aria-pressed="true" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">スポット</button>
      <button aria-pressed="false" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">今週末</button>
      <button aria-pressed="false" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">祭り・行事</button>
    </div>
  </div>

  <button aria-label="祭り:獅子舞奉納" style="position: absolute; left: 176px; top: 300px; width: 36px; height: 44px; padding: 0; border: 0; background: transparent;"><svg width="36" height="44" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 29s-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z" style="fill: var(--accent); stroke: var(--bg); stroke-width: 1.5;"></path><circle cx="12" cy="12" r="4" style="fill: var(--on);"></circle></svg></button>
  <button aria-label="スポット" style="position: absolute; left: 92px; top: 380px; width: 32px; height: 40px; padding: 0; border: 0; background: transparent;"><svg width="32" height="40" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 29s-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z" style="fill: var(--surface); stroke: var(--ink); stroke-width: 1.5;"></path><circle cx="12" cy="12" r="4" style="fill: var(--ink);"></circle></svg></button>
  <button aria-label="イベント" style="position: absolute; left: 280px; top: 430px; width: 32px; height: 40px; padding: 0; border: 0; background: transparent;"><svg width="32" height="40" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 29s-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z" style="fill: var(--accent); stroke: var(--bg); stroke-width: 1.5;"></path><circle cx="12" cy="12" r="4" style="fill: var(--on);"></circle></svg></button>
  <div style="position: absolute; left: 236px; top: 220px; width: 40px; height: 40px; border-radius: 999px; background: var(--surface); border: 2px solid var(--accent); display: grid; place-items: center; font-size: 14px; font-weight: 700;">5</div>

  <button aria-label="現在地" style="position: absolute; right: 16px; bottom: 236px; width: 48px; height: 48px; border-radius: 999px; border: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>

  <section style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 20px 20px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 10px;">
    <div style="width: 40px; height: 4px; border-radius: 999px; background: var(--strong); align-self: center;"></div>
    <a href="EventDetail.dc.html" style="display: flex; gap: 12px; color: inherit; text-decoration: none;">
      <div style="flex: 0 0 88px; height: 88px; border-radius: 10px; background: var(--sunken); display: grid; place-items: center; color: var(--strong); font-size: 12px;">[写真]</div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <span style="font-size: 14px; line-height: 22px; font-weight: 700; color: var(--accent);">今夜 18:00〜21:00 宵宮</span>
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 17px; line-height: 24px;">[集落名]の獅子舞奉納</span>
        <span style="font-size: 14px; line-height: 22px; color: var(--muted);">高松市 塩江町 ・ 2.4km</span>
      </div>
    </a>
    <p style="margin: 0; font-family: 'Yomogi', sans-serif; font-size: 15px; line-height: 22px; color: var(--muted);">夜道は暗いです。ライトをお忘れなく。</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
