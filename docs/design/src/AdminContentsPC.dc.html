<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>管理: スポット・記事・コメント(PC)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Yomogi&amp;family=Yusei+Magic&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-day{--bg:#fbf8ee;--surface:#ffffff;--sunken:#f2eedf;--ink:#26261c;--muted:#5a5a48;--line:#ddd7c2;--strong:#7d775e;--on:#ffffff;--ok:#2b7048;--warn:#7a5200;--ng:#a8241c}
.s-autumn{--accent:#b24a0c}
a{color:var(--accent)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="t-day s-autumn" style="min-height: 1000px; background: var(--bg); color: var(--ink); font-family: 'BIZ UDPGothic', sans-serif; font-size: 15px; line-height: 24px; display: flex; flex-wrap: wrap; align-items: stretch;">
<nav aria-label="管理メニュー" style="flex: 1 1 240px; max-width: 280px; min-width: 0; background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box;">
  <a href="AdminPC.dc.html" style="display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-size: 22px; line-height: 28px; padding: 4px 8px 16px;"><span style="font-family: 'Yusei Magic', sans-serif;">ド田舎</span><span style="font-family: 'Yusei Magic', sans-serif; color: var(--accent); font-size: 16px; margin-left: -6px;">.net</span><span style="font: 700 12px/18px 'BIZ UDPGothic', sans-serif; border: 1px solid var(--strong); border-radius: 6px; padding: 0 6px;">管理</span></a>
  <a href="AdminPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">ダッシュボード</a>
  <a href="AdminReviewPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">審査</a>
  <a href="AdminTipsPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">情報提供</a>
  <a href="AdminCorrectionsPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">修正依頼</a>
  <a href="AdminRejectedPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">却下ボックス</a>
  <a href="AdminInquiriesPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">お問い合わせ</a>
  <span style="font-size: 12px; line-height: 18px; color: var(--muted); padding: 16px 12px 4px;">コンテンツ</span>
  <a href="AdminEventsPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">行事・開催回</a>
  <a href="#" aria-current="page" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; background: var(--sunken); color: var(--ink); font-weight: 700; text-decoration: none;">スポット・記事・コメント</a>
  <a href="AdminRegionsPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">地域ページ</a>
  <a href="AdminDraftPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">AI下書き作成</a>
  <a href="AdminSourcesPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">情報源の巡回</a>
  <span style="font-size: 12px; line-height: 18px; color: var(--muted); padding: 16px 12px 4px;">運営</span>
  <a href="AdminMastersPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">マスタ</a>
  <a href="AdminUsersPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">会員</a>
  <a href="AdminAdsPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">広告枠</a>
  <a href="AdminSettingsPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">設定</a>
  <a href="AdminLogsPC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">ログ</a>
  <a href="AdminUpdatePC.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; color: var(--ink); text-decoration: none;">アップデート</a>
</nav>
<main style="flex: 999 1 640px; min-width: 0; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box;">
  <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px;"><h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 28px; line-height: 36px;">スポット・記事・コメント</h1><span style="font-size: 13px; color: var(--muted);">公開中のものを直す・止める画面です</span></div>
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
  <div role="tablist" aria-label="種類" style="display: flex; gap: 8px; flex-wrap: wrap;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>
    <div style="display: flex; gap: 8px; align-items: center;"><label for="cq" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">探す</label><input id="cq" type="search" placeholder="探す" style="width: 240px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 2px solid var(--strong); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit;"><sc-if value="{{hasAdd}}" hint-placeholder-val="{{true}}"><button style="height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">{{add}}</button></sc-if></div>
  </div>
  <div style="background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); overflow-x: auto;">
    <table style="width: 100%; min-width: 860px; border-collapse: collapse;">
      <thead><tr style="text-align: left; font-size: 13px; color: var(--muted);"><th scope="col" style="padding: 10px 16px;">{{c1}}</th><th scope="col" style="padding: 10px 16px;">{{c2}}</th><th scope="col" style="padding: 10px 16px;">{{c3}}</th><th scope="col" style="padding: 10px 16px;">{{c4}}</th><th scope="col" style="padding: 10px 16px;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">操作</span></th></tr></thead>
      <tbody>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <tr style="border-top: 1px solid var(--line);"><td style="padding: 12px 16px; font-weight: 700;">{{r.title}}</td><td style="padding: 12px 16px;">{{r.sub}}</td><td style="padding: 12px 16px;">{{r.when}}</td><td style="padding: 12px 16px;"><span style="{{r.chipStyle}}">{{r.chip}}</span></td><td style="padding: 12px 16px; white-space: nowrap;"><button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 13px/1 'BIZ UDPGothic', sans-serif;">{{r.op}}</button> <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 13px/1 'BIZ UDPGothic', sans-serif;">履歴</button></td></tr>
        </sc-for>
      </tbody>
    </table>
  </div>
  <p style="margin: 0; font-size: 13px; color: var(--muted);">{{note}}</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const tab = (this.state && this.state.tab) || 'spot';
const base = 'flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; font: 700 14px/1 BIZ UDPGothic, sans-serif; cursor: pointer; ';
const tabs = [['spot','スポット 52'],['article','記事 18'],['comment','コメント 340']];
const chip = (k) => 'display: inline-block; font-size: 12px; line-height: 18px; font-weight: 700; color: var(--' + k + '); border: 1px solid var(--' + k + '); border-radius: 6px; padding: 0 6px; white-space: nowrap;';
const data = {
spot: { cols: ['スポット', '地域・分類', '更新', '状態'], add: 'スポットを追加する', note: 'お休みや営業時間が古いスポットは、1年更新がないと「要確認」になります。', rows: [
 ['峠の無人販売所', '塩江町 ・ 買う', '昨日(修正依頼で反映)', 'ok', '公開', '編集'],
 ['[地名]の棚田', 'まんのう町 ・ 景色', '3か月前', 'ok', '公開', '編集'],
 ['海辺の小さな駄菓子屋', '三豊市 ・ 買う', '1年2か月前', 'warn', '要確認', '編集'],
 ['廃校のカフェ', '綾川町 ・ 食べる', '半年前', 'ng', '非公開', '編集']
]},
article: { cols: ['記事', '書いた人', '更新', '状態'], add: '記事を書く', note: '記事は管理者が書くもの(特集・まとめ)です。投稿された情報は「審査」から入ります。', rows: [
 ['この秋、香川の山あいで見られる獅子舞まとめ', 'shikoku_taro', '今日', 'ok', '公開', '編集'],
 ['無人販売所のまわり方(小銭を忘れずに)', 'shikoku_taro', '2週間前', 'ok', '公開', '編集'],
 ['[町名]の冬の行事カレンダー', 'shikoku_taro', '下書き', 'warn', '下書き', '編集'],
 ['AI下書き: 島の朝市の紹介', 'AI下書き', '昨日', 'warn', '下書き', '編集']
]},
comment: { cols: ['コメント', '対象', '投稿', '状態'], add: '', note: '通報が3件たまると自動で非公開になり、ここで「通報あり」として残ります。', rows: [
 ['駐車場は神社の裏にありました', '獅子舞奉納', '会員 ・ 2時間前', 'ok', '公開', '非公開にする'],
 ['今年も行きます!', '島の朝市', '匿名 ・ 昨日', 'ok', '公開', '非公開にする'],
 ['[外部サイトへの誘導文]', '峠の無人販売所', '匿名 ・ 2日前', 'ng', '通報あり 3', '公開に戻す'],
 ['道が細いので軽自動車がおすすめ', '[地名]の棚田', '会員 ・ 5日前', 'ok', '公開', '非公開にする']
]}
};
const d = data[tab];
return {
tabs: tabs.map(([id, label]) => ({
 label: label,
 selected: tab === id ? 'true' : 'false',
 style: tab === id ? base + 'background: var(--surface); border: 2px solid var(--accent); color: var(--accent);' : base + 'background: var(--surface); border: 2px solid var(--strong); color: var(--ink);',
 pick: () => this.setState({ tab: id })
})),
c1: d.cols[0], c2: d.cols[1], c3: d.cols[2], c4: d.cols[3],
hasAdd: !!d.add, add: d.add, note: d.note,
rows: d.rows.map(r => ({ title: r[0], sub: r[1], when: r[2], chipStyle: chip(r[3]), chip: r[4], op: r[5] }))
};
}
}
</script>
</body>
</html>
