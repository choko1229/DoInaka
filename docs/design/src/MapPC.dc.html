<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>地図(PC)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Yomogi&amp;family=Yusei+Magic&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-night{--bg:#141b2b;--surface:#1d2638;--sunken:#0f1522;--ink:#eceff5;--muted:#a9b3c6;--line:#2c3850;--strong:#7d8aa3;--sky1:#0e1424;--sky2:#24304a;--on:#141b2b}
.t-night.s-autumn{--accent:#f4a261}
a{color:var(--accent)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="t-night s-autumn" style="width: 1280px; height: 800px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: 'BIZ UDPGothic', sans-serif; font-size: 15px; line-height: 24px; overflow: hidden;">
  <header style="flex: 0 0 auto; background: linear-gradient(90deg, var(--sky1), var(--sky2)); padding: 10px 24px; display: flex; justify-content: space-between; align-items: center;">
    <a href="TopPC.dc.html" style="display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-size: 24px; line-height: 28px;"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 26 L12 13 L17 19 L21 14 L29 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><path d="M24 5 V26 M20 8 H28 M21 11 H27" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></path></svg><span style="font-family: 'Yusei Magic', sans-serif;">ド田舎</span><span style="font-family: 'Yusei Magic', sans-serif; color: var(--accent); font-size: 17px; margin-left: -6px;">.net</span></a>
    <nav style="display: flex; gap: 24px; align-items: center; font-weight: 700;"><a href="EventsPC.dc.html" style="color: var(--ink); text-decoration: none;">イベント</a><a href="#" style="color: var(--ink); text-decoration: none;">スポット</a><a href="#" aria-current="page" style="color: var(--accent);">地図</a><a href="PostPC.dc.html" style="height: 40px; padding: 0 18px; border-radius: 999px; background: var(--accent); color: var(--on); display: inline-flex; align-items: center; text-decoration: none;">投稿する</a></nav>
  </header>

  <div style="flex: 1; display: flex; min-height: 0;">
    <aside style="flex: 0 0 380px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;">
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line);">
        <label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">この範囲で探す</label>
        <input id="mq" type="search" placeholder="この範囲で探す" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 2px solid var(--strong); border-radius: 999px; background: var(--sunken); color: var(--ink); font: inherit;">
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <button aria-pressed="true" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font: 700 13px/1 'BIZ UDPGothic', sans-serif;">イベント</button>
          <button aria-pressed="true" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font: 700 13px/1 'BIZ UDPGothic', sans-serif;">スポット</button>
          <button aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 13px/1 'BIZ UDPGothic', sans-serif;">今週末</button>
          <button aria-pressed="false" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 13px/1 'BIZ UDPGothic', sans-serif;">祭り・行事</button>
        </div>
        <span style="font-size: 13px; color: var(--muted);">この範囲に 9件</span>
      </div>
      <ul style="margin: 0; padding: 0; list-style: none; overflow-y: auto; flex: 1;">
        <li><a href="EventDetailPC.dc.html" style="display: flex; gap: 12px; padding: 12px 16px; color: inherit; text-decoration: none; background: var(--sunken);"><div style="flex: 0 0 72px; height: 72px; border-radius: 10px; background: var(--line);"></div><div style="display: flex; flex-direction: column; min-width: 0;"><span style="font-size: 13px; font-weight: 700; color: var(--accent);">今夜 18:00〜 宵宮</span><b style="font-family: 'Zen Maru Gothic', sans-serif; font-size: 16px; line-height: 22px;">[集落名]の獅子舞奉納</b><span style="font-size: 13px; color: var(--muted);">塩江町 ・ 2.4km</span></div></a></li>
        <li><a href="SpotPC.dc.html" style="display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); color: inherit; text-decoration: none;"><div style="flex: 0 0 72px; height: 72px; border-radius: 10px; background: var(--line);"></div><div style="display: flex; flex-direction: column; min-width: 0;"><span style="font-size: 13px; font-weight: 700; color: var(--muted);">スポット</span><b style="font-family: 'Zen Maru Gothic', sans-serif; font-size: 16px; line-height: 22px;">峠の無人販売所</b><span style="font-size: 13px; color: var(--muted);">塩江町 ・ 3.1km</span></div></a></li>
        <li><a href="#" style="display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); color: inherit; text-decoration: none;"><div style="flex: 0 0 72px; height: 72px; border-radius: 10px; background: var(--line);"></div><div style="display: flex; flex-direction: column; min-width: 0;"><span style="font-size: 13px; font-weight: 700; color: var(--accent);">10月12日(日)</span><b style="font-family: 'Zen Maru Gothic', sans-serif; font-size: 16px; line-height: 22px;">棚田の稲刈り体験</b><span style="font-size: 13px; color: var(--muted);">まんのう町 ・ 14km</span></div></a></li>
      </ul>
      <p style="margin: 0; padding: 12px 16px; border-top: 1px solid var(--line); font-family: 'Yomogi', sans-serif; font-size: 15px; color: var(--muted);">夜道は暗いです。ライトをお忘れなく。</p>
    </aside>

    <div aria-label="地図" style="flex: 1; position: relative; background: var(--sunken); overflow: hidden;">
      <svg width="900" height="740" viewBox="0 0 900 740" fill="none" aria-hidden="true" style="position: absolute; inset: 0;">
        <path d="M0 120 C200 160 300 90 480 130 S800 100 900 120 V0 H0Z" style="fill: #13233a;"></path>
        <path d="M-20 460 Q260 400 460 460 T920 430" stroke="#2c3850" stroke-width="14"></path>
        <path d="M340 120 Q380 330 300 740" stroke="#2c3850" stroke-width="8"></path>
        <path d="M620 140 Q680 420 780 740" stroke="#2c3850" stroke-width="6"></path>
        <ellipse cx="700" cy="320" rx="60" ry="32" style="fill: #13233a;"></ellipse>
        <circle cx="150" cy="380" r="2.2" style="fill: #f2e27a;"></circle><circle cx="520" cy="600" r="1.8" style="fill: #f2e27a;"></circle><circle cx="820" cy="230" r="2" style="fill: #f2e27a;"></circle>
      </svg>
      <button aria-label="獅子舞奉納(選択中)" style="position: absolute; left: 420px; top: 260px; width: 44px; height: 54px; padding: 0; border: 0; background: transparent;"><svg width="44" height="54" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 29s-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z" style="fill: var(--accent); stroke: var(--ink); stroke-width: 1.5;"></path><circle cx="12" cy="12" r="4" style="fill: var(--on);"></circle></svg></button>
      <div style="position: absolute; left: 470px; top: 236px; background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 20px; box-shadow: 0 1px 0 var(--line);"><b>[集落名]の獅子舞奉納</b><br><span style="color: var(--accent);">今夜 18:00〜</span></div>
      <button aria-label="スポット" style="position: absolute; left: 300px; top: 340px; width: 36px; height: 44px; padding: 0; border: 0; background: transparent;"><svg width="36" height="44" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 29s-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z" style="fill: var(--surface); stroke: var(--ink); stroke-width: 1.5;"></path><circle cx="12" cy="12" r="4" style="fill: var(--ink);"></circle></svg></button>
      <button aria-label="イベント" style="position: absolute; left: 640px; top: 470px; width: 36px; height: 44px; padding: 0; border: 0; background: transparent;"><svg width="36" height="44" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 29s-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z" style="fill: var(--accent); stroke: var(--bg); stroke-width: 1.5;"></path><circle cx="12" cy="12" r="4" style="fill: var(--on);"></circle></svg></button>
      <div style="position: absolute; left: 560px; top: 160px; width: 44px; height: 44px; border-radius: 999px; background: var(--surface); border: 2px solid var(--accent); display: grid; place-items: center; font-weight: 700;">5</div>
      <div style="position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px;">
        <button aria-label="拡大" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: var(--surface); color: var(--ink); font: 700 20px/1 'BIZ UDPGothic', sans-serif;">+</button>
        <button aria-label="縮小" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: var(--surface); color: var(--ink); font: 700 20px/1 'BIZ UDPGothic', sans-serif;">−</button>
        <button aria-label="現在地" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
      </div>
      <span style="position: absolute; right: 12px; bottom: 8px; font-size: 11px; color: var(--muted);">地理院タイル(淡色を夜用に調整)</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
