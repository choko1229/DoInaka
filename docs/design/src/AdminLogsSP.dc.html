<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>管理: ログ(スマホ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Yomogi&amp;family=Yusei+Magic&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-day{--bg:#fbf8ee;--surface:#ffffff;--sunken:#f2eedf;--ink:#26261c;--muted:#5a5a48;--line:#ddd7c2;--strong:#7d775e;--on:#ffffff;--ok:#2b7048;--warn:#7a5200;--ng:#a8241c}
.s-autumn{--accent:#b24a0c}
a{color:var(--accent)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="t-day s-autumn" style="width: 390px; min-height: 1200px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'BIZ UDPGothic', sans-serif; font-size: 15px; line-height: 24px;">
<header style="background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;">
  <a href="AdminSP.dc.html" style="display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-size: 20px; line-height: 24px;"><span style="font-family: 'Yusei Magic', sans-serif;">ド田舎</span><span style="font-family: 'Yusei Magic', sans-serif; color: var(--accent); font-size: 15px; margin-left: -6px;">.net</span><span style="font: 700 12px/18px 'BIZ UDPGothic', sans-serif; border: 1px solid var(--strong); border-radius: 6px; padding: 0 6px;">管理</span></a>
  <button aria-label="管理メニュー" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</header>
<main style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
  <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; line-height: 30px;">ログ</h1>
  <div role="tablist" aria-label="ログの種類" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>
  <span style="font-size: 14px; color: var(--muted);">{{note}}</span>
  <ul style="margin: 0; padding: 0; list-style: none; background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line);">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <li style="padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px;">
        <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center;"><span style="font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;">{{r.time}} ・ {{r.who}}</span><sc-if value="{{r.hasChip}}" hint-placeholder-val="{{true}}"><span style="{{r.chipStyle}}">{{r.chip}}</span></sc-if></div>
        <b>{{r.what}}</b>
        <span style="font-size: 14px; color: var(--muted);">{{r.detail}}</span>
      </li>
    </sc-for>
  </ul>
  <button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">CSVで書き出す</button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
renderVals() {
const tab = (this.state && this.state.tab) || 'ops';
const base = 'flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; font: 700 14px/1 BIZ UDPGothic, sans-serif; cursor: pointer; ';
const tabs = [['ops','操作ログ'],['review','審査ログ'],['ai','AIログ'],['error','エラーログ']];
const data = {
ops: { note: '管理者の操作を365日保存', rows: [
 ['10/06 09:12', 'shikoku_taro', '設定を変更', '自動承認スコア 0.85 → 0.90', 'muted', ''],
 ['10/06 08:40', 'shikoku_taro', '会員を停止', '[ユーザー名](宣伝の連投)', 'warn', '停止'],
 ['10/05 22:03', 'shikoku_taro', 'メールアドレスを表示', 'udon_hanako の詳細', 'muted', ''],
 ['10/05 21:30', 'shikoku_taro', 'ログイン', '2段階認証OK', 'ok', 'OK']
]},
review: { note: '投稿・コメント・修正依頼の判定', rows: [
 ['10/06 09:30', 'AI', '自動承認', '島の朝市(修正依頼) スコア 0.96', 'ok', '承認'],
 ['10/06 09:02', 'shikoku_taro', '承認', '獅子舞奉納(投稿)', 'ok', '承認'],
 ['10/05 23:11', 'AI', '自動却下', '【激安】今すぐ…(投稿) スコア 0.03', 'ng', '却下'],
 ['10/05 18:45', 'AI', '人に回す', '太鼓台の宮入り(修正依頼) 情報元URLなし', 'warn', '保留']
]},
ai: { note: '今日 31回(無料枠の制限エラーが出るまで使用)', rows: [
 ['10/06 09:30', '[無料モデルA]', '判定・整形', '1.8秒 ・ 成功', 'ok', '成功'],
 ['10/06 09:29', '[無料モデルB]', '判定・整形', 'レート制限 → 1分後に再実行', 'warn', '再試行'],
 ['10/06 08:10', '[無料モデルA]', 'URLから下書き', '4.2秒 ・ 成功', 'ok', '成功'],
 ['10/05 23:59', '—', '上限到達', '残り3件を明日(UTC 0:00)に回した', 'warn', '翌日へ']
]},
error: { note: '直近のエラー(重複はまとめて表示)', rows: [
 ['10/06 07:15', 'queue', '画像の変換に失敗', 'HEICを読めない ・ 2回', 'ng', 'エラー'],
 ['10/05 12:00', 'cron', 'スケジューラーが遅れた', '前回から3分空いた', 'warn', '注意'],
 ['10/04 03:20', 'mail', '通知メール送信失敗', 'SMTPタイムアウト → 再送で成功', 'muted', '解決']
]}
};
const d = data[tab];
const chip = (k, t) => k === 'muted' && !t ? '' : 'display: inline-block; font-size: 12px; line-height: 18px; font-weight: 700; color: var(--' + k + '); border: 1px solid var(--' + k + '); border-radius: 6px; padding: 0 6px; white-space: nowrap;';
return {
tabs: tabs.map(([id, label]) => ({
 label: label,
 selected: tab === id ? 'true' : 'false',
 style: tab === id ? base + 'background: var(--surface); border: 2px solid var(--accent); color: var(--accent);' : base + 'background: var(--surface); border: 2px solid var(--strong); color: var(--ink);',
 pick: () => this.setState({ tab: id })
})),
note: d.note,
rows: d.rows.map(r => ({ time: r[0], who: r[1], what: r[2], detail: r[3], chipStyle: chip(r[4], r[5]), chip: r[5], hasChip: !!r[5] }))
};
}
}
</script>
</body>
</html>
