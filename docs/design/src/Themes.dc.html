<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>時間帯×季節の見え方</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Yomogi&amp;family=Yusei+Magic&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-day{--bg:#fbf8ee;--surface:#ffffff;--sunken:#f2eedf;--ink:#26261c;--muted:#5a5a48;--line:#ddd7c2;--strong:#7d775e;--sky1:#9cd3ec;--sky2:#e8f4e1;--hill:#8fb86b;--on:#ffffff}
.t-morning{--bg:#f3f8f7;--surface:#ffffff;--sunken:#e6f0ee;--ink:#1e2b2a;--muted:#4f615f;--line:#cddcd9;--strong:#6a7f7c;--sky1:#cde8ef;--sky2:#f3f8f7;--hill:#a8c98d;--on:#ffffff}
.t-evening{--bg:#fbf1e6;--surface:#fffdf9;--sunken:#f4e3d2;--ink:#2e211a;--muted:#6a5246;--line:#e8d2bd;--strong:#8a6e5e;--sky1:#f2a65a;--sky2:#f9dcc0;--hill:#7c8a52;--on:#ffffff}
.t-night{--bg:#141b2b;--surface:#1d2638;--sunken:#0f1522;--ink:#eceff5;--muted:#a9b3c6;--line:#2c3850;--strong:#7d8aa3;--sky1:#0e1424;--sky2:#24304a;--hill:#1a2a2a;--on:#141b2b}
.s-spring{--accent:#b8325f}.s-summer{--accent:#1b7352}.s-autumn{--accent:#b24a0c}.s-winter{--accent:#2d5a99}
.t-night.s-spring{--accent:#f48fb5}.t-night.s-summer{--accent:#6fd3a6}.t-night.s-autumn{--accent:#f4a261}.t-night.s-winter{--accent:#8db4f0}
.glow{fill:#f2e27a;opacity:0}.t-night .glow{opacity:1}
</style>
</helmet>
<div style="width: 1720px; height: 620px; box-sizing: border-box; padding: 40px; background: #eeeae0; display: flex; gap: 40px; font-family: 'BIZ UDPGothic', sans-serif;">
  <sc-for list="{{combos}}" as="c" hint-placeholder-count="4">
    <div style="flex: 0 0 390px; display: flex; flex-direction: column; gap: 12px;">
      <span style="font: 700 16px/24px 'BIZ UDPGothic', sans-serif; color: #26261c;">{{c.label}}</span>
      <div class="{{c.cls}}" style="border-radius: 20px; overflow: hidden; background: var(--bg); color: var(--ink); height: 500px; display: flex; flex-direction: column;">
        <div style="position: relative; background: linear-gradient(var(--sky1), var(--sky2)); padding: 14px 16px 72px; overflow: hidden;">
          <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 24px; line-height: 28px; position: relative; z-index: 1;">
            <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 26 L12 13 L17 19 L21 14 L29 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path><path d="M24 5 V26 M20 8 H28 M21 11 H27" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></path></svg>
            <span style="font-family: 'Yusei Magic', sans-serif;">ド田舎</span><span style="font-family: 'Yusei Magic', sans-serif; color: var(--accent); font-size: 17px; margin-left: -6px;">.net</span>
          </div>
          <p style="position: relative; z-index: 1; margin: 20px 0 0; font: 700 26px/34px 'Zen Maru Gothic', sans-serif;">何もないが、ある。</p>
          <p style="position: relative; z-index: 1; margin: 2px 0 0; font: 400 15px/22px 'Yomogi', sans-serif; color: var(--muted);">{{c.aside}}</p>
          <svg viewBox="0 0 390 72" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; bottom: -1px; width: 100%; height: 72px;"><path d="M0 42 Q70 14 140 36 T270 26 T390 34 V72 H0Z" style="fill: var(--hill);"></path><path d="M0 58 Q195 50 390 58 V72 H0Z" style="fill: var(--bg);"></path><circle class="glow" cx="80" cy="12" r="1.6"></circle><circle class="glow" cx="300" cy="20" r="1.8"></circle><circle class="glow" cx="210" cy="8" r="1.3"></circle></svg>
        </div>
        <div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px;">
          <div style="background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
            <span style="font: 700 14px/22px 'BIZ UDPGothic', sans-serif; color: var(--accent);">10月12日(日) 9:00〜</span>
            <span style="font: 700 17px/24px 'Zen Maru Gothic', sans-serif;">[集落名]の獅子舞奉納</span>
            <span style="font-size: 14px; line-height: 22px; color: var(--muted);">高松市 塩江町</span>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <span style="height: 44px; padding: 0 20px; border-radius: 999px; background: var(--accent); color: var(--on); font: 700 15px/1 'BIZ UDPGothic', sans-serif; display: inline-flex; align-items: center;">投稿する</span>
            <span style="height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 15px/1 'BIZ UDPGothic', sans-serif; display: inline-flex; align-items: center; box-sizing: border-box;">地図で見る</span>
          </div>
          <span style="font-size: 14px; line-height: 22px; color: var(--accent); text-decoration: underline;">すべてのイベントを見る</span>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1720,"height":620}}'>
class Component extends DCLogic {
renderVals() {
return {
combos: [
{ cls: 't-morning s-spring', label: '朝(5〜10時) × 春(桜)', aside: '朝もやの田んぼから、おはようございます。' },
{ cls: 't-day s-summer', label: '昼(10〜16時) × 夏(青田)', aside: '香川のいなかの、今日と今週末。' },
{ cls: 't-evening s-autumn', label: '夕(16〜19時) × 秋(柿・稲穂)', aside: '夕焼けの時間です。' },
{ cls: 't-night s-winter', label: '夜(19〜5時) × 冬(冬の空)', aside: '夜道は暗いです。ライトをお忘れなく。' }
]
};
}
}
</script>
</body>
</html>
