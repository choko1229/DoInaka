<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>管理: マスタ(スマホ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Yomogi&amp;family=Yusei+Magic&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-day{--bg:#fbf8ee;--surface:#ffffff;--sunken:#f2eedf;--ink:#26261c;--muted:#5a5a48;--line:#ddd7c2;--strong:#7d775e;--on:#ffffff;--ok:#2b7048;--warn:#7a5200;--ng:#a8241c}
.s-autumn{--accent:#b24a0c}
a{color:var(--accent)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="t-day s-autumn" style="width: 390px; min-height: 1300px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'BIZ UDPGothic', sans-serif; font-size: 15px; line-height: 24px;">

<header style="background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;">
  <a href="AdminSP.dc.html" style="display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-size: 20px; line-height: 24px;"><span style="font-family: 'Yusei Magic', sans-serif;">ド田舎</span><span style="font-family: 'Yusei Magic', sans-serif; color: var(--accent); font-size: 15px; margin-left: -6px;">.net</span><span style="font: 700 12px/18px 'BIZ UDPGothic', sans-serif; border: 1px solid var(--strong); border-radius: 6px; padding: 0 6px;">管理</span></a>
  <button aria-label="管理メニュー" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</header>

<main style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
  <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; line-height: 30px;">マスタ</h1>
  <div role="tablist" aria-label="マスタの種類" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line);">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{isArea}}" hint-placeholder-val="{{true}}">
    <nav aria-label="パンくず" style="font-size: 13px; color: var(--muted);">四国 / 香川県 / <b style="color: var(--ink);">高松市</b></nav>
    <ul style="margin: 0; padding: 0; list-style: none; background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line);">
      <li style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px;"><span style="flex: 1; display: flex; flex-direction: column; line-height: 20px;"><b>塩江</b><span style="font-size: 12px; color: var(--muted);">shionoe ・ 12件</span></span><input type="checkbox" checked aria-label="塩江を公開" style="width: 20px; height: 20px; accent-color: var(--accent);"><a href="#" aria-label="塩江を編集" style="width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); text-decoration: none;">›</a></li>
      <li style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-top: 1px solid var(--line);"><span style="flex: 1; display: flex; flex-direction: column; line-height: 20px;"><b>男木島・女木島</b><span style="font-size: 12px; color: var(--muted);">ogijima-megijima ・ 7件</span></span><input type="checkbox" checked aria-label="男木島・女木島を公開" style="width: 20px; height: 20px; accent-color: var(--accent);"><a href="#" aria-label="男木島・女木島を編集" style="width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); text-decoration: none;">›</a></li>
      <li style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-top: 1px solid var(--line);"><span style="flex: 1; display: flex; flex-direction: column; line-height: 20px;"><b>香南</b><span style="font-size: 12px; color: var(--muted);">konan ・ 4件</span></span><input type="checkbox" checked aria-label="香南を公開" style="width: 20px; height: 20px; accent-color: var(--accent);"><a href="#" aria-label="香南を編集" style="width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); text-decoration: none;">›</a></li>
    </ul>
    <button style="height: 44px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">＋ 高松市にエリアを追加</button>
  </sc-if>

  <sc-if value="{{isCategory}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 4px; background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 12px 16px;">
      <b style="padding-bottom: 4px;">イベント用</b>
      <sc-for list="{{eventCats}}" as="c" hint-placeholder-count="6"><div style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-top: 1px solid var(--line);"><span aria-hidden="true" style="color: var(--muted);">⋮⋮</span><span style="flex: 1;">{{c}}</span><a href="#" style="font-size: 14px; font-weight: 700;">編集</a></div></sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 12px 16px;">
      <b style="padding-bottom: 4px;">スポット用</b>
      <sc-for list="{{spotCats}}" as="c" hint-placeholder-count="7"><div style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-top: 1px solid var(--line);"><span aria-hidden="true" style="color: var(--muted);">⋮⋮</span><span style="flex: 1;">{{c}}</span><a href="#" style="font-size: 14px; font-weight: 700;">編集</a></div></sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isTag}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; gap: 8px; flex-wrap: wrap;"><sc-for list="{{tags}}" as="t" hint-placeholder-count="8"><span style="background: var(--surface); box-shadow: 0 1px 0 var(--line); border-radius: 6px; padding: 6px 10px; font-size: 14px;">#{{t.name}} <span style="color: var(--muted);">{{t.count}}</span></span></sc-for></div>
  </sc-if>

  <sc-if value="{{isNg}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 8px; background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 16px;">
      <label for="ngs" style="font-weight: 700;">追加する語</label>
      <input id="ngs" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 2px solid var(--strong); border-radius: 6px; background: var(--sunken); color: var(--ink); font: inherit;">
      <button style="height: 44px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">追加</button>
      <span style="font-size: 13px; color: var(--muted);">登録済み 24語(伏せ字で表示)</span>
    </div>
  </sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
renderVals() {
const tab = (this.state && this.state.tab) || 'area';
const base = 'height: 48px; border: 0; background: transparent; font: 700 14px/1 BIZ UDPGothic, sans-serif; cursor: pointer; ';
const list = [['area','エリア'],['category','カテゴリ'],['tag','タグ'],['ng','NG語']];
return {
tabs: list.map(([id, label]) => ({
label: label,
selected: tab === id ? 'true' : 'false',
style: tab === id ? base + 'color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent);' : base + 'color: var(--muted);',
pick: () => this.setState({ tab: id })
})),
isArea: tab === 'area',
isCategory: tab === 'category',
isTag: tab === 'tag',
isNg: tab === 'ng',
eventCats: ['祭り・行事','体験・ワークショップ','食・マルシェ','アート・展示','花・季節','スポーツ・アウトドア'],
spotCats: ['絶景・自然','島','食・産直','歴史・文化','アート','体験施設','田舎の暮らし'],
tags: [{name:'獅子舞',count:18},{name:'無料',count:42},{name:'子ども',count:9},{name:'棚田',count:6},{name:'ため池',count:11},{name:'無人販売所',count:7},{name:'渡し船',count:3},{name:'紅葉',count:12}]
};
}
}
</script>
</body>
</html>
