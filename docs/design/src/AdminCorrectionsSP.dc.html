<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>管理: 修正依頼(スマホ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Yomogi&amp;family=Yusei+Magic&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-day{--bg:#fbf8ee;--surface:#ffffff;--sunken:#f2eedf;--ink:#26261c;--muted:#5a5a48;--line:#ddd7c2;--strong:#7d775e;--on:#ffffff;--ok:#2b7048;--warn:#7a5200;--ng:#a8241c}
.s-autumn{--accent:#b24a0c}
a{color:var(--accent)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="t-day s-autumn" style="width: 390px; min-height: 1300px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'BIZ UDPGothic', sans-serif; font-size: 15px; line-height: 24px;">
<header style="background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;">
  <a href="AdminSP.dc.html" style="display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-size: 20px; line-height: 24px;"><span style="font-family: 'Yusei Magic', sans-serif;">ド田舎</span><span style="font-family: 'Yusei Magic', sans-serif; color: var(--accent); font-size: 15px; margin-left: -6px;">.net</span><span style="font: 700 12px/18px 'BIZ UDPGothic', sans-serif; border: 1px solid var(--strong); border-radius: 6px; padding: 0 6px;">管理</span></a>
  <button aria-label="管理メニュー" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</header>
<main style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
  <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; line-height: 30px;">修正依頼</h1>
  <span style="font-size: 13px; color: var(--muted); margin-top: -8px;">修正依頼は公開されません</span>
  <section style="display: flex; flex-direction: column; gap: 10px;">
    <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 18px; line-height: 26px;">AIが自動で反映(要確認 2件)</h2>
    <div style="background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; color: var(--muted);">会員(実績8) ・ 3時間前</span>
      <a href="#" style="font-weight: 700;">島の朝市</a>
      <span>開始時刻: <s style="color: var(--muted);">8:00</s> → <b>7:00</b></span>
      <span style="font-size: 13px;">根拠: <a href="#">主催者のSNS</a></span>
      <div style="display: flex; gap: 8px;"><button style="height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">確認済みにする</button><button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">元に戻す</button></div>
    </div>
    <div style="background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; color: var(--muted);">会員(実績5) ・ 昨日</span>
      <a href="#" style="font-weight: 700;">峠の無人販売所</a>
      <span>お休み: <s style="color: var(--muted);">不定休</s> → <b>12〜2月は休み</b></span>
      <span style="font-size: 13px;">根拠: <a href="#">現地の張り紙の写真</a></span>
      <div style="display: flex; gap: 8px;"><button style="height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">確認済みにする</button><button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">元に戻す</button></div>
    </div>
  </section>
  <section style="display: flex; flex-direction: column; gap: 10px;">
    <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 18px; line-height: 26px;">手動で確認(1件)</h2>
    <div style="background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; color: var(--muted);">匿名 ・ 昨日 ・ 情報元URLなし</span>
      <b>秋季例大祭 太鼓台の宮入り</b>
      <span>開始時刻: <s style="color: var(--muted);">13:00</s> → <b>14:00</b></span>
      <span style="font-size: 14px; color: var(--muted);">「今年は14時からと地区の回覧で見ました」</span>
      <div style="display: flex; flex-direction: column; gap: 8px;"><button style="height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on); font: 700 15px/1 'BIZ UDPGothic', sans-serif;">反映する</button><div style="display: flex; gap: 8px;"><button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">編集して反映</button><button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--ng); background: var(--surface); color: var(--ng); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">見送る</button></div></div>
    </div>
  </section>
  <p style="margin: 0; font-size: 13px; color: var(--muted);">反映した変更は変更履歴に残り、いつでも戻せます。</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
