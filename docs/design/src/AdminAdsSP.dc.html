<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>管理: 広告枠(スマホ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Yomogi&amp;family=Yusei+Magic&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-day{--bg:#fbf8ee;--surface:#ffffff;--sunken:#f2eedf;--ink:#26261c;--muted:#5a5a48;--line:#ddd7c2;--strong:#7d775e;--on:#ffffff;--ok:#2b7048;--warn:#7a5200;--ng:#a8241c}
.s-autumn{--accent:#b24a0c}
a{color:var(--accent)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="t-day s-autumn" style="width: 390px; min-height: 1300px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'BIZ UDPGothic', sans-serif; font-size: 15px; line-height: 24px;">
<header style="background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;">
  <a href="AdminSP.dc.html" style="display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-size: 20px; line-height: 24px;"><span style="font-family: 'Yusei Magic', sans-serif;">ド田舎</span><span style="font-family: 'Yusei Magic', sans-serif; color: var(--accent); font-size: 15px; margin-left: -6px;">.net</span><span style="font: 700 12px/18px 'BIZ UDPGothic', sans-serif; border: 1px solid var(--strong); border-radius: 6px; padding: 0 6px;">管理</span></a>
  <button aria-label="管理メニュー" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</header>
<main style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
  <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; line-height: 30px;">広告枠</h1>
  <section style="display: flex; flex-direction: column; gap: 10px;">
    <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 18px; line-height: 26px;">AdSenseを出す場所</h2>
    <div style="background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 6px 16px; display: flex; flex-direction: column;">
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: var(--accent);"><span><b>トップ: 「今週末」の下</b><br><span style="font-size: 13px; color: var(--muted);">レスポンシブ ・ 1枠</span></span></label><label style="display: flex; align-items: center; gap: 10px; min-height: 44px;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: var(--accent);"><span><b>一覧: 10件ごと</b><br><span style="font-size: 13px; color: var(--muted);">一覧の中に「広告」と表示して挟む</span></span></label><label style="display: flex; align-items: center; gap: 10px; min-height: 44px;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: var(--accent);"><span><b>詳細: 本文の下</b><br><span style="font-size: 13px; color: var(--muted);">地図・アクセスより下に置く</span></span></label><label style="display: flex; align-items: center; gap: 10px; min-height: 44px;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent);"><span><b>詳細: 本文の途中</b><br><span style="font-size: 13px; color: var(--muted);">読みにくくなるので初期はオフ</span></span></label><label style="display: flex; align-items: center; gap: 10px; min-height: 44px;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: var(--accent);"><span><b>地図・投稿・マイページ</b><br><span style="font-size: 13px; color: var(--muted);">操作の邪魔になるため出さない(固定)</span></span></label>
    </div>
  </section>
  <section style="display: flex; flex-direction: column; gap: 10px;">
    <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 18px; line-height: 26px;">PR枠</h2>
    <div style="background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><span style="display: inline-block; font-size: 12px; line-height: 18px; font-weight: 700; color: var(--ok); border: 1px solid var(--ok); border-radius: 6px; padding: 0 6px; white-space: nowrap;">掲載中</span><span style="font-size: 12px; color: var(--muted);">10/1〜10/31</span></div>
      <b>[道の駅名] 秋の収穫祭</b>
      <span style="font-size: 14px; color: var(--muted);">トップ「今週末」の下</span>
      <div style="display: flex; gap: 8px;"><button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">編集</button><button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--ng); background: var(--surface); color: var(--ng); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">止める</button></div>
    </div>
    <div style="background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><span style="display: inline-block; font-size: 12px; line-height: 18px; font-weight: 700; color: var(--warn); border: 1px solid var(--warn); border-radius: 6px; padding: 0 6px; white-space: nowrap;">予約</span><span style="font-size: 12px; color: var(--muted);">11/1〜11/30</span></div>
      <b>[町名] 移住相談会</b>
      <span style="font-size: 14px; color: var(--muted);">詳細: 本文の下</span>
      <div style="display: flex; gap: 8px;"><button style="height: 44px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">編集</button></div>
    </div>
    <button style="height: 48px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on); font: 700 15px/1 'BIZ UDPGothic', sans-serif;">PR枠を追加する</button>
  </section>
  <p style="margin: 0; font-size: 13px; color: var(--muted);">PR枠には必ず「PR」と表示します。期間が過ぎると自動で外れます。</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
