<!doctype html>

<head>

<body>
<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=Yomogi&amp;family=Yusei+Magic&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}

<div class="t-day s-autumn" style="width: 390px; min-height: 1500px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'BIZ UDPGothic', sans-serif; font-size: 16px; line-height: 28px;">

<header style="background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;">
  <a href="#" style="display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-size: 20px; line-height: 24px;">
    <span style="font-family: 'Yusei Magic', sans-serif;">ド田舎</span><span style="font-family: 'Yusei Magic', sans-serif; color: var(--accent); font-size: 15px; margin-left: -6px;">.net</span>

<main style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <a href="#" style="background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 10px 12px; color: var(--ink); text-decoration: none; display: flex; flex-direction: column;"><b style="font-size: 24px; line-height: 32px; color: var(--accent);">7</b><span style="font-size: 12px; line-height: 18px;">審査待ち</span></a>

    <span style="display: flex; align-items: center; gap: 8px;"><span style="width: 10px; height: 10px; border-radius: 999px; background: var(--ok);" aria-hidden="true"></span>使える(制限エラーはまだ出ていません)</span>
    <span style="color: var(--muted);">制限エラーが出るまで使います</span>
  </div>

  <div style="display: flex; gap: 8px; overflow-x: auto;">
    <button aria-pressed="true" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">すべて 7</button>
    <button aria-pressed="false" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">投稿 4</button>
    <button aria-pressed="false" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">コメント 2</button>
    <button aria-pressed="false" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--strong); background: var(--surface); color: var(--ink); font: 700 14px/1 'BIZ UDPGothic', sans-serif;">修正依頼 1</button>

      <span style="display: flex; justify-content: space-between; font-size: 12px; line-height: 18px; color: var(--muted);"><span>イベント ・ 匿名 ・ 2時間前</span><span>#20261006-K7Q2MX</span></span>
      <b style="font-family: 'Zen Maru Gothic', sans-serif; font-size: 17px; line-height: 24px;">[地区名]秋祭り 子ども獅子</b>
      <span style="display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; line-height: 18px;">
        <span style="color: var(--ok); border: 1px solid var(--ok); border-radius: 6px; padding: 0 6px; font-weight: 700;">安全 0.96</span>
        <span style="color: var(--warn); border: 1px solid var(--warn); border-radius: 6px; padding: 0 6px; font-weight: 700;">顔あり</span>
        <span style="color: var(--warn); border: 1px solid var(--warn); border-radius: 6px; padding: 0 6px; font-weight: 700;">重複候補 1</span>
        <span style="background: var(--sunken); border-radius: 6px; padding: 0 6px;">画像 3枚</span>
      </span>
    </a></li>
    <li><a href="#" style="display: flex; flex-direction: column; gap: 4px; background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 12px 16px; color: var(--ink); text-decoration: none;">
      <span style="display: flex; justify-content: space-between; font-size: 12px; line-height: 18px; color: var(--muted);"><span>コメント ・ 会員(実績2) ・ 5時間前</span></span>
      <b style="font-size: 16px; line-height: 24px;">「駐車場は公民館の前が使えますか?」</b>
      <span style="display: flex; gap: 6px; font-size: 12px; line-height: 18px;"><span style="color: var(--ok); border: 1px solid var(--ok); border-radius: 6px; padding: 0 6px; font-weight: 700;">安全 0.99</span><span style="background: var(--sunken); border-radius: 6px; padding: 0 6px;">実績不足で手動</span></span>
    </a></li>
    <li><a href="#" style="display: flex; flex-direction: column; gap: 4px; background: var(--surface); border-radius: 14px; box-shadow: 0 1px 0 var(--line); padding: 12px 16px; color: var(--ink); text-decoration: none;">
      <span style="display: flex; justify-content: space-between; font-size: 12px; line-height: 18px; color: var(--muted);"><span>スポット ・ 匿名 ・ 昨日</span></span>
      <b style="font-family: 'Zen Maru Gothic', sans-serif; font-size: 17px; line-height: 24px;">[ため池の名前]の朝もや</b>
      <span style="display: flex; gap: 6px; font-size: 12px; line-height: 18px;"><span style="color: var(--muted); border: 1px solid var(--strong); border-radius: 6px; padding: 0 6px; font-weight: 700;">AI判定待ち(翌日)</span></span>
    </a></li>
  </ul>
  <p style="margin: 0; text-align: center; font-family: 'Yomogi', sans-serif; font-size: 15px; line-height: 22px; color: var(--muted);">回覧板は、早めに回しましょう。</p>
</main>
