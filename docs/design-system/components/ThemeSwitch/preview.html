<!-- @dsCard group="操作" height=130 subtitle="自動・昼固定・夜固定" -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Yomogi&family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink)}
.wrap{padding:24px;display:grid;gap:8px}
.label{font:400 14px/22px var(--font-body);color:var(--ink-muted)}
.seg{display:inline-flex;background:var(--surface-sunken);border-radius:var(--radius-pill);padding:4px;gap:4px;width:max-content}
.seg button{font:700 14px/1 var(--font-body);height:36px;padding:0 16px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 2px var(--accent) inset;color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
<div class="wrap"><span class="label">空の色</span><div class="seg" role="group" aria-label="空の色"><button aria-pressed="true">自動(いまの空)</button><button aria-pressed="false">昼</button><button aria-pressed="false">夜</button></div></div>
