name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ブランチ保護の「必須のチェック」はこのジョブ名(ci)。Pint・Larastan(max)・Pest・ビルドをまとめて確かめる
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        # Docker Hub の匿名の取得制限で CI が止まったので、同じ公式イメージの Amazon ECR Public のミラーから取る(版は同じ 8.0.46)
        image: public.ecr.aws/docker/library/mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: doinaka_test
        ports:
          - 3306:3306
        # 本番(kagoya)と同じ照合順序・時刻にする。サーバーの既定に頼らないことも、アプリ側のテストで確かめている
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: doinaka_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, gd, imagick, zip, bcmath, exif, fileinfo
          tools: composer:v2
          coverage: none
          ini-values: post_max_size=110M, upload_max_filesize=10M, memory_limit=512M, date.timezone=Asia/Tokyo

      - name: Composer のキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: DB のトリガー作成を許可(情報元のトリガーのため)
        run: mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"

      - name: 整形(Pint)
        run: ./vendor/bin/pint --test

      - name: 静的解析(Larastan レベル max)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: アセットのビルド
        run: npm run build

      # CI には .env がなく、Laravel が .env を読もうとして PHP の警告(file_get_contents)が出ていたので、空の .env を置く(値は env: と phpunit.xml が決める)
      - name: テスト用の空の .env を置く
        run: touch .env

      - name: テスト(Pest)
        run: ./vendor/bin/pest

      # 画面のコントラストの検査(Playwright + axe-core)。見本データ入りの別の DB(doinaka_e2e)で、アプリを動かして、
      # 朝・昼・夕・夜 × 春夏秋冬の主要な公開画面を見る(文字 4.5:1、部品の枠 3:1。e2e/contrast.spec.js)
      - name: コントラスト検査の準備(DB・見本データ・アプリの起動)
        env:
          APP_ENV: local
          APP_DEBUG: 'false'
          DB_DATABASE: doinaka_e2e
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE doinaka_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_ja_0900_as_cs_ks"
          export APP_KEY="$(php artisan key:generate --show)"
          php artisan migrate --force
          php artisan db:seed --class=InitialDataSeeder --force
          php artisan db:seed --class=DemoSeeder --force
          nohup php artisan serve --host=127.0.0.1 --port=8080 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/up && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8080/kagawa/events/

      - name: コントラスト検査(Playwright + axe-core)
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: |
          npx playwright install --with-deps chromium
          npm run e2e:contrast
